  <style>
    .out { animation: emerge 2.4s ease-out infinite; }
    @keyframes emerge { 0% { transform: translateY(-30px); opacity: 0; } 15% { opacity: 1; } 45%,80% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
    .led { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
